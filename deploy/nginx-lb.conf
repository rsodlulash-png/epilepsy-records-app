# Nginx load balancer config for Lb01.
# Install as /etc/nginx/sites-available/epilepsy-lb (see README).
# REPLACE WEB01_IP and WEB02_IP with the real addresses of Web01 and Web02.

upstream epilepsy_backend {
    # Round robin by default: Web01, Web02, Web01, ...
    # ip_hash;   # <- uncomment to pin each client IP to one server (see README)

    server WEB01_IP:80 max_fails=2 fail_timeout=10s;
    server WEB02_IP:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://epilepsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If one server errors or times out, retry the request on the other
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        # Shows the request went through the load balancer
        add_header X-Load-Balancer "lb01" always;
    }

    access_log /var/log/nginx/epilepsy-lb.access.log;
    error_log  /var/log/nginx/epilepsy-lb.error.log;
}
